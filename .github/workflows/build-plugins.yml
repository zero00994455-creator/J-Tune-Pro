name: Build J-Tune Plugins

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows-vst3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCOPY_PLUGIN_AFTER_BUILD=FALSE

      - name: Build VST3
        run: cmake --build build --config Release --target JTune_VST3

      - name: Upload VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J-Tune-Windows-VST3
          path: build/JTune_artefacts/Release/VST3/J-Tune.vst3
